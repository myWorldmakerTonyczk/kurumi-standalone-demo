<meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;background:#f5f2ee;color:#29231f;max-width:840px;margin:48px auto;padding:0 20px}section,form{background:white;padding:20px;margin:16px 0;border:1px solid #ddd2ca;border-radius:12px}input,textarea,button{font:inherit;padding:8px;margin:5px 0}input:not([type=checkbox]),textarea{width:100%;box-sizing:border-box}button{background:#742c3b;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#742c3b}</style><title>久留美用户面板</title><h1>久留美 · 模拟交易</h1><p id="mode"></p><p role="alert" id="error"></p><form id="login"><label>登录名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><main id="panel" hidden><form id="profile"><h2>人格与模型</h2><label>人格设定<textarea name="persona" maxlength="4000"></textarea></label><label>OpenAI 兼容接口地址<input name="url" placeholder="默认使用 OpenAI"></label><label>模型名称<input name="model"></label><label>API Key<input type="password" name="key" autocomplete="new-password"></label><p id="keystatus"></p><label><input type="checkbox" name="clear"> 清除已保存的 Key</label><br><button>保存</button></form><form id="chat"><h2>和久留美聊天</h2><pre id="messages"></pre><label>消息<input name="message" maxlength="2000" required></label><button>发送</button></form><section><h2>模拟账本</h2><pre id="ledger"></pre></section></main><script>
const auth={};
const el=id=>document.getElementById(id); const show=(id,v)=>el(id).textContent=v;
async function api(path, body){
 const headers={...auth};
 if(body!==undefined) headers['Content-Type']='application/json';
 const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers,body:JSON.stringify(body)});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.error||'请求失败（'+r.status+'）')}
 return r.json();
}
function form(id,action){el(id).onsubmit=async e=>{e.preventDefault();try{show('error',''); await action(Object.fromEntries(new FormData(e.target)));}catch(err){show('error',err.message)}}}
async function load(profile=false){const s=await api('state');el('login').hidden=true;el('panel').hidden=false;show('mode',s.demo?'离线行情演示 · 所有成交均为模拟':'实时行情 · 所有成交均为模拟');
if(profile)for(const [k,v] of Object.entries(s.profile))el('profile').elements[k].value=v;
show('keystatus',s.has_key?'已保存 Key，留空保持原值':'尚未设置 Key');
show('messages',s.chat.map(m=>(m.role==='user'?'你':'久留美')+'：'+m.content).join('\n\n'));
const g=s.state.game;show('ledger',g.name+' · 余额 '+g.balance+' · '+g.status+'\n\n'+s.state.logs.map(l=>l.action+' · '+(l.reason||'')).join('\n'))}
form('login',async b=>{await api('login',b);el('login').reset();await load(true)});
form('profile',async b=>{await api('profile',b);el('profile').elements.key.value='';el('profile').elements.clear.checked=false;await load(true)});
form('chat',async b=>{await api('chat',b);el('chat').reset();await load()});
load(true).catch(()=>{});setInterval(()=>{if(!el('panel').hidden)load().catch(()=>{})},5000);</script>
