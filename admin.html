<meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;background:#f5f2ee;color:#29231f;max-width:840px;margin:48px auto;padding:0 20px}section,form{background:white;padding:20px;margin:16px 0;border:1px solid #ddd2ca;border-radius:12px}input,textarea,button{font:inherit;padding:8px;margin:5px 0}input:not([type=checkbox]),textarea{width:100%;box-sizing:border-box}button{background:#742c3b;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#742c3b}</style><title>久留美管理</title><h1>久留美 · 管理面板</h1><a id="portal">打开用户面板</a><p id="mode"></p><p role="alert" id="error"></p><form id="create"><h2>创建用户和交易实例</h2><label>用户昵称<input name="nickname" required maxlength="40"></label><label>实例名称<input name="name" required maxlength="80"></label><label><input type="checkbox" name="auto" checked> 启用定时看盘</label><br><button>创建账号</button></form><pre id="credentials"></pre><section><h2>用户与实例</h2><pre id="games"></pre></section><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');
if(token){sessionStorage.setItem('kurumi-admin',token);history.replaceState(null,'',location.pathname)}
const auth={Authorization:'Bearer '+(sessionStorage.getItem('kurumi-admin')||'')};
const el=id=>document.getElementById(id); const show=(id,v)=>el(id).textContent=v;
async function api(path, body){
 const headers={...auth};
 if(body!==undefined) headers['Content-Type']='application/json';
 const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers,body:JSON.stringify(body)});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.error||'请求失败（'+r.status+'）')}
 return r.json();
}
function form(id,action){el(id).onsubmit=async e=>{e.preventDefault();try{show('error',''); await action(Object.fromEntries(new FormData(e.target)));}catch(err){show('error',err.message)}}}
async function load(){const s=await api('state');el('portal').href=s.portal;show('mode',s.demo?'离线行情演示':'实时行情模式');show('games',s.games.map(g=>g.owner+' · '+g.username+' · '+g.name+(g.auto?' · 定时看盘':'')).join('\n')||'尚无账户')}
form('create',async b=>{const result=await api('create',{...b,auto:b.auto==='on'});show('credentials','登录名 '+result.username+'\n密码 '+result.password);await load()});
load().catch(e=>show('error',e.message));</script>
